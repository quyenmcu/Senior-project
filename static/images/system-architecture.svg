<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">IrisMind system architecture</title><desc id="desc">Camera fatigue detection and smartphone telematics join through a private driving session, then feed aggregation, risk prediction, premium calculation and the web dashboard.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06152c"/><stop offset="1" stop-color="#0a3158"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#29dcff"/><stop offset="1" stop-color="#1677e8"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="12" stdDeviation="14" flood-color="#001126" flood-opacity=".45"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#40d9ff"/></marker><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#6fe7ff" stroke-opacity=".055"/></pattern></defs>
  <rect width="1400" height="790" rx="28" fill="url(#bg)"/><rect width="1400" height="790" rx="28" fill="url(#grid)"/><g font-family="Manrope,Arial,sans-serif"><text x="70" y="68" fill="#fff" font-size="28" font-weight="800">IrisMind system architecture</text><text x="70" y="98" fill="#84a8c8" font-size="14">Private multimodal sensing → explainable risk → personalized premium</text></g>
  <g filter="url(#shadow)" font-family="Manrope,Arial,sans-serif">
    <g transform="translate(70 150)"><rect width="270" height="176" rx="20" fill="#0b284a" stroke="#28d7ff" stroke-opacity=".55"/><circle cx="48" cy="46" r="24" fill="#123c66"/><path d="M35 42h26v18H35zM40 36h16l5 6H35z" fill="none" stroke="#4de1ff" stroke-width="3"/><text x="84" y="43" fill="#fff" font-size="18" font-weight="800">Camera</text><text x="84" y="65" fill="#8fb3d2" font-size="12">Video frames</text><text x="28" y="108" fill="#dcecff" font-size="14" font-weight="700">MediaPipe + fatigue model</text><text x="28" y="135" fill="#8fb3d2" font-size="12">EAR · MAR · eye state · yawning</text><circle cx="34" cy="154" r="5" fill="#3df58a"/><circle cx="64" cy="154" r="5" fill="#ffd43b"/><circle cx="94" cy="154" r="5" fill="#ff4d4d"/><circle cx="124" cy="154" r="5" fill="#ff8b3d"/></g>
    <g transform="translate(70 430)"><rect width="270" height="176" rx="20" fill="#0b284a" stroke="#28d7ff" stroke-opacity=".55"/><circle cx="48" cy="46" r="24" fill="#123c66"/><rect x="38" y="27" width="20" height="38" rx="4" fill="none" stroke="#4de1ff" stroke-width="3"/><text x="84" y="43" fill="#fff" font-size="18" font-weight="800">Smartphone</text><text x="84" y="65" fill="#8fb3d2" font-size="12">Telematics stream</text><text x="28" y="108" fill="#dcecff" font-size="14" font-weight="700">Motion processing</text><text x="28" y="135" fill="#8fb3d2" font-size="12">Acceleration · braking · turns</text><text x="28" y="158" fill="#4de1ff" font-size="12" font-weight="700">Normal · Medium · Aggressive</text></g>
    <g transform="translate(430 260)"><rect width="260" height="230" rx="24" fill="#0d3762" stroke="#46ddff"/><rect x="24" y="22" width="212" height="38" rx="10" fill="#092746"/><text x="130" y="46" text-anchor="middle" fill="#4de1ff" font-size="12" font-weight="800">AUTHENTICATED SESSION</text><text x="130" y="96" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">Django backend</text><text x="130" y="124" text-anchor="middle" fill="#9abbd6" font-size="12">Identity + timestamps</text><line x1="30" y1="147" x2="230" y2="147" stroke="#fff" stroke-opacity=".12"/><text x="130" y="177" text-anchor="middle" fill="#dcecff" font-size="13">Fatigue events + telemetry</text><text x="130" y="203" text-anchor="middle" fill="#78e6ff" font-size="12">Per-user data isolation</text></g>
    <g transform="translate(790 150)"><rect width="255" height="176" rx="20" fill="#0b284a" stroke="#28d7ff" stroke-opacity=".55"/><text x="28" y="47" fill="#fff" font-size="18" font-weight="800">Aggregation</text><text x="28" y="70" fill="#8fb3d2" font-size="12">Weekly + monthly features</text><text x="28" y="108" fill="#dcecff" font-size="14" font-weight="700">Unified risk profile</text><text x="28" y="135" fill="#8fb3d2" font-size="12">Fatigue + driving behavior</text><text x="28" y="158" fill="#4de1ff" font-size="12" font-weight="700">No row-order joins</text></g>
    <g transform="translate(790 430)"><rect width="255" height="176" rx="20" fill="#0b284a" stroke="#28d7ff" stroke-opacity=".55"/><text x="28" y="47" fill="#fff" font-size="18" font-weight="800">AI prediction</text><text x="28" y="70" fill="#8fb3d2" font-size="12">Current + future risk</text><text x="28" y="108" fill="#dcecff" font-size="14" font-weight="700">MLP risk model</text><text x="28" y="135" fill="#8fb3d2" font-size="12">Optional LSTM trajectory</text><text x="28" y="158" fill="#4de1ff" font-size="12" font-weight="700">Confidence-aware output</text></g>
    <g transform="translate(1130 260)"><rect width="200" height="230" rx="24" fill="url(#accent)"/><text x="100" y="54" text-anchor="middle" fill="#031a31" font-size="13" font-weight="800">USER EXPERIENCE</text><text x="100" y="98" text-anchor="middle" fill="#fff" font-size="20" font-weight="800">Risk &amp; premium</text><text x="100" y="127" text-anchor="middle" fill="#e9fbff" font-size="12">Transparent formula</text><line x1="28" y1="150" x2="172" y2="150" stroke="#fff" stroke-opacity=".4"/><text x="100" y="180" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Web dashboard</text><text x="100" y="204" text-anchor="middle" fill="#e9fbff" font-size="12">Weekly · Monthly · Series</text></g>
  </g>
  <g fill="none" stroke="#40d9ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"><path d="M340 238C390 238 392 323 430 323"/><path d="M340 518C390 518 392 427 430 427"/><path d="M690 330C742 330 744 238 790 238"/><path d="M690 418c52 0 54 100 100 100"/><path d="M918 326v104"/><path d="M1045 518c55 0 55-85 85-85"/></g>
  <g font-family="Manrope,Arial,sans-serif"><rect x="70" y="680" width="1260" height="60" rx="14" fill="#061b34" stroke="#4de1ff" stroke-opacity=".2"/><path d="M102 710h18v-10a9 9 0 0118 0v10h4v16h-40z" fill="none" stroke="#45ddff" stroke-width="2"/><text x="160" y="713" fill="#fff" font-size="13" font-weight="800">Privacy by design</text><text x="160" y="731" fill="#85a9c8" font-size="11">Raw face images and video remain protected; ordinary risk and pricing queries use event metadata and aggregates.</text></g>
</svg>
